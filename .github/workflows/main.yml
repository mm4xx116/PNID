name: Automation CI

on: [push, pull_request] # Запускати при кожному оновленні коду

jobs:
  main-pipeline:
    runs-on: ubuntu-latest
    strategy:
      # Завдання 3: Мультиверсійне тестування
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Завдання 2: Linting (Перевірка стилю)
      - name: Code Quality (Flake8)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      # Завдання 1 та 5: Тести та HTML-звіт
      - name: Run Tests & Generate Report
        run: pytest --html=report.html --self-contained-html

      # Збереження звіту як артефакту
      - name: Archive report
        uses: actions/upload-artifact@v3
        with:
          name: test-report-${{ matrix.python-version }}
          path: report.html

  # Завдання 4: Збірка Docker-контейнера
  docker-build:
    needs: main-pipeline # Запускати тільки якщо тести пройшли
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build Image
        run: docker build . -t my-app:latest
